name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter analysis, tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Verify generated sources
        run: |
          flutter gen-l10n
          dart run build_runner build
          git diff --exit-code -- lib
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build with local example configuration
        run: flutter build web --release --no-pub --dart-define-from-file=env/example.json
      - name: Build the isolated browser demo
        run: flutter build web --release --no-pub --dart-define=DEMO_MODE=true --output=build/demo
      - name: Install Chromium and WebKit for browser checks
        working-directory: e2e
        run: |
          npm ci
          npx playwright-core install --with-deps chromium webkit
      - name: Exercise the demo without a backend
        working-directory: .
        run: |
          python3 e2e/spa_server.py app/build/demo 3001 &
          demo_server_pid=$!
          trap 'kill "$demo_server_pid"' EXIT
          node e2e/flow_demo.js
          node e2e/flow_zoom.js
          BROWSER=webkit node e2e/flow_zoom.js
          BROWSER=chromium node e2e/flow_setlist_details.js
          BROWSER=webkit node e2e/flow_setlist_details.js
          BROWSER=chromium node e2e/flow_sheet_upload.js
          BROWSER=webkit node e2e/flow_sheet_upload.js

  database:
    name: Fresh database migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Local email-login tests never contact Google or a hosted project.
      GOOGLE_WEB_CLIENT_ID: ci-local-client
      GOOGLE_WEB_CLIENT_SECRET: ci-local-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.98.2
      - run: supabase db start
      - run: supabase test db --local
      - if: always()
        run: supabase stop --no-backup

  functions:
    name: Edge Function types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.5.6
      - run: deno task check
      - run: deno task test
