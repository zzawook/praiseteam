name: praiseteam
description: "PraiseTeam - worship team app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.0
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image: ^4.12.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfrx: ^2.11.0
  perfect_freehand: ^2.5.2+1
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/GowunBatang-OFL.txt
  fonts:
    # Subset (KS X 1001 + ASCII) of Gowun Batang Bold, SIL OFL 1.1.
    # Used only for setlist titles and song names on the setlist.
    - family: GowunBatang
      fonts:
        - asset: assets/fonts/GowunBatang-Bold-subset.ttf
          weight: 700
